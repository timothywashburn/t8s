---
- name: Configure nodes
  hosts: k3s_cluster
  become: true

  tasks:
    # https://longhorn.io/kb/troubleshooting-volume-with-multipath/
    # TODO: do this in a less horrible way
    - name: Remove multipath-tools
      apt:
        name: multipath-tools
        state: absent
        purge: true

    - name: Configure system limits
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-k3s.conf
        reload: true
      loop:
        - { key: "fs.inotify.max_user_instances", value: "8192" }
        - { key: "fs.inotify.max_user_watches", value: "524288" }
        - { key: "vm.panic_on_oom", value: "0" }
        - { key: "vm.overcommit_memory", value: "1" }
        - { key: "kernel.panic", value: "10" }
        - { key: "kernel.panic_on_oops", value: "1" }

- name: Setup control plane
  hosts: control_plane
  become: true

  vars:
    cluster_name: "{{ inventory_file | basename | regex_replace('\\.ini$', '') }}"

  handlers:
    - name: Restart K3s
      systemd:
        name: k3s
        state: restarted
      ignore_errors: true

  tasks:
    - name: Load cluster config
      include_vars:
        file: "{{ playbook_dir }}/../clusters/{{ cluster_name }}.yaml"
        name: config

    - name: Ensure required directories exist
      file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/rancher/k3s, mode: '0755' }
        - { path: /var/lib/rancher/k3s/server, mode: '0755' }
        - { path: /var/lib/rancher/k3s/server/logs, mode: '0700' }

    - name: Write PSA config
      template:
        src: templates/psa.yaml
        dest: /var/lib/rancher/k3s/server/psa.yaml
        mode: '0644'
      notify: Restart K3s

    - name: Write audit policy
      template:
        src: templates/audit.yaml
        dest: /var/lib/rancher/k3s/server/audit.yaml
        mode: '0644'
      notify: Restart K3s

    - name: Write K3s config
      template:
        src: templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
      notify: Restart K3s

    - name: Install K3s control plane
      shell: |
        curl -sfL https://get.k3s.io | sh -s
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Restrict PKI certificate permissions
      shell: chmod -R 600 /var/lib/rancher/k3s/server/tls/*.crt
      changed_when: false

    - name: Read K3s token
      slurp:
        path: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file

    - name: Set K3s token as fact
      set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"

- name: Setup worker nodes
  hosts: workers
  become: true

  vars:
    k3s_control_plane_ip: "{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}"
    k3s_token: "{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}"
    k3s_url: "https://{{ k3s_control_plane_ip }}:{{ hostvars[groups['control_plane'][0]]['k3s_api_port'] }}"

  handlers:
    - name: Restart K3s agent
      systemd:
        name: k3s-agent
        state: restarted
      ignore_errors: true

  tasks:
    - name: Ensure /etc/rancher/k3s exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Write K3s agent config
      template:
        src: templates/k3s-agent-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
      notify: Restart K3s agent

    - name: Install K3s to Worker Node
      shell: |
        export K3S_URL="{{ k3s_url }}"
        export K3S_TOKEN="{{ k3s_token }}"
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service
      no_log: true

- name: Verification
  hosts: control_plane
  become: true

  tasks:
    - name: Get all nodes
      command: kubectl get nodes
      register: nodes
      changed_when: false

    - name: Display cluster nodes
      debug:
        msg: "{{ nodes.stdout_lines }}"

    - name: Verify expected node count
      assert:
        that:
          - (nodes.stdout_lines | length - 1) == (groups['control_plane'] | length + groups['workers'] | default([]) | length)
        fail_msg: "Expected {{ groups['control_plane'] | length + groups['workers'] | default([]) | length }} nodes, but found {{ nodes.stdout_lines | length - 1 }}"
        success_msg: "All {{ groups['control_plane'] | length + groups['workers'] | default([]) | length }} nodes joined successfully"
